name: Compilar Mirror TV

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Descargar codigo y submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar herramientas Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git patch python3 perl make \
            nasm yasm pkg-config

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK y NDK
        run: |
          sdkmanager --install \
            "platforms;android-37" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Configurar herramientas
        run: |
          chmod +x ./gradlew
          git submodule update --init --recursive
          python3 --version
          patch --version

      - name: Compilar APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: MirrorTV-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
